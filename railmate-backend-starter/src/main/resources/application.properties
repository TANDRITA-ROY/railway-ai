spring.application.name=railmate
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railmate_db}
spring.datasource.username=${DB_USERNAME:railmate_user}
spring.datasource.password=${DB_PASSWORD:railmate_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
# Local AI model
railmate.ai.ollama.base-url=http://localhost:11434
railmate.ai.ollama.model-name=qwen2.5:3b
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.stop.command=down
railmate.ai.ollama.embedding-model-name=nomic-embed-text
railmate.ai.chroma.base-url=http://localhost:8000
railmate.ai.chroma.tenant=default_tenant
railmate.ai.chroma.database=default_database
railmate.ai.chroma.collection=railmate-knowledge