
services:
  postgres:
    image: postgres:17
    container_name: railmate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: railmate_db
      POSTGRES_USER: railmate_user
      POSTGRES_PASSWORD: railmate_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railmate_user -d railmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
